
name: Build Ride Acceptor APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          find extracted -name settings.gradle.kts

      - name: Build APK
        run: |
          cat > "$GITHUB_WORKSPACE/jvm17.init.gradle" <<'EOF'
          allprojects {
            tasks.configureEach { task ->
              if (task.name == 'compileDebugJavaWithJavac') {
                task.sourceCompatibility = '17'
                task.targetCompatibility = '17'
              }
              if (task.name == 'compileDebugKotlin') {
                task.kotlinOptions.jvmTarget = '17'
              }
            }
          }
          EOF
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT"
          cd "$PROJECT"
          gradle --no-daemon --init-script "$GITHUB_WORKSPACE/jvm17.init.gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RideAcceptor-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
